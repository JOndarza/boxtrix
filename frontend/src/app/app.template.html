@if (showWizard()) {
  <app-wizard (dismissed)="showWizard.set(false)"></app-wizard>

} @else if (isPanelOpen()) {
  <!-- Full-screen editor — same layout as wizard step 2 -->
  <div class="app-scene-editor">
    <div class="scene-editor-bar">
      <button class="wizard-back-btn" (click)="closePanel()">← Back to scene</button>
    </div>
    <div class="wizard-edit-layout">
      <div class="wizard-edit-main">
        <app-input-panel></app-input-panel>
      </div>
      <app-legend></app-legend>
    </div>
  </div>

} @else {
  <!-- No panel — scene is fully visible -->
}

<app-loading-overlay></app-loading-overlay>
<app-header></app-header>
<app-sidebar></app-sidebar>
<app-footer></app-footer>

@defer (on immediate) {
  <app-canvas></app-canvas>
} @placeholder {
  <div class="canvas-placeholder"></div>
} @error {
  <p class="canvas-error">No se pudo cargar el visor 3D.</p>
}

@defer (on idle) {
  <app-graphics-settings></app-graphics-settings>
}

@defer (on idle) {
  <app-keyboard-help></app-keyboard-help>
}

@defer (on idle) {
  <app-stats></app-stats>
}
