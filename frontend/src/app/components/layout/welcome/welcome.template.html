<div class="welcome-backdrop"></div>

<div class="welcome-card">
  <header class="welcome-header">
    <span class="welcome-logo" aria-hidden="true">■</span>
    <h1 class="welcome-title">BoxTrix</h1>
    <p class="welcome-tagline">3D Space Optimizer</p>
  </header>

  <div class="welcome-divider"></div>

  <p class="welcome-description">
    Calculate the optimal placement of your collectible boxes into storage areas
    using 3D bin packing algorithms. Upload a <strong>.json</strong> file with
    your areas and boxes to get started.
  </p>

  <div class="welcome-actions">
    <label for="welcome-file-upload" class="welcome-upload-btn">
      Upload JSON file
    </label>
    <input
      id="welcome-file-upload"
      type="file"
      accept=".json"
      class="visually-hidden"
      (change)="load($event)"
      aria-label="Upload JSON configuration file"
    />

    <button class="welcome-demo-btn" (click)="loadDemo()" aria-label="Load a demo with sample boxes and shelves">
      Try demo &nbsp;▶
    </button>
  </div>
</div>
