<div class="wizard-backdrop"></div>

<div class="wizard-card" [class.wizard-card--fullscreen]="step() === 2">

  <!-- ── Step 1: Load ─────────────────────────────────────────────────────── -->
  @if (step() === 1) {
    <header class="wizard-header">
      <span class="wizard-logo" aria-hidden="true">■</span>
      <h1 class="wizard-title">BoxTrix</h1>
      <p class="wizard-tagline">3D Space Optimizer</p>
    </header>

    <div class="wizard-divider"></div>

    <p class="wizard-description">
      Calculate the optimal placement of your collectible boxes into storage areas
      using 3D bin packing algorithms. Upload a <strong>.json</strong> file with
      your areas and boxes to get started.
    </p>

    @if (parseError()) {
      <p class="wizard-error" role="alert">{{ parseError() }}</p>
    }

    <div class="wizard-actions">
      <label for="wizard-file-upload" class="wizard-upload-btn">
        Upload JSON file
      </label>
      <input
        id="wizard-file-upload"
        type="file"
        accept=".json"
        class="visually-hidden"
        (change)="onFileSelected($event)"
        aria-label="Upload JSON configuration file"
      />

      <button class="wizard-demo-btn" (click)="loadDemo()" aria-label="Load a demo with sample boxes and shelves">
        Try demo &nbsp;▶
      </button>
    </div>
  }

  <!-- ── Step 2: Edit in InputPanel ──────────────────────────────────────── -->
  @if (step() === 2) {
    <div class="wizard-edit-bar">
      <button class="wizard-back-btn" (click)="back()" aria-label="Go back to file upload">
        ← Back
      </button>
    </div>
    <app-input-panel></app-input-panel>
  }

</div>
