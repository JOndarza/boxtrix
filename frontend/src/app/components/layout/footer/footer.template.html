<div class="step-controls">
  @if (hasData) {
    <div class="step-indicator" aria-live="polite" aria-label="Current step">
      {{ step }} / {{ maxStep }}
    </div>
  }

  <div class="step-buttons" role="group" aria-label="Playback controls">
    <button
      class="step-button"
      [disabled]="!hasData"
      (click)="first()"
      aria-label="Go to first step"
    >
      <ng-icon name="matSkipPrevious" aria-hidden="true"></ng-icon>
      <span class="step-button-text">First</span>
    </button>

    <button
      class="step-button secondary"
      [disabled]="!hasData"
      (click)="back()"
      aria-label="Go to previous step"
    >
      <ng-icon name="matFastRewind" aria-hidden="true"></ng-icon>
      <span class="step-button-text">Back</span>
    </button>

    <button
      class="step-button main"
      [disabled]="!hasData"
      (click)="play()"
      [attr.aria-label]="isPlaying() ? 'Pause auto-play' : 'Start auto-play'"
      [attr.aria-pressed]="isPlaying()"
    >
      <ng-icon name="matPlayArrow" aria-hidden="true"></ng-icon>
      <span class="step-button-text">{{ isPlaying() ? 'Pause' : 'Play' }}</span>
    </button>

    <button
      class="step-button secondary"
      [disabled]="!hasData"
      (click)="forward()"
      aria-label="Go to next step"
    >
      <ng-icon name="matFastForward" aria-hidden="true"></ng-icon>
      <span class="step-button-text">Forward</span>
    </button>

    <button
      class="step-button"
      [disabled]="!hasData"
      (click)="last()"
      aria-label="Go to last step"
    >
      <ng-icon name="matSkipNext" aria-hidden="true"></ng-icon>
      <span class="step-button-text">Last</span>
    </button>
  </div>
</div>
