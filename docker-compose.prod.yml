services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boxtrix-backend
    ports:
      - "4200:4200"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:4200
      - FRONTEND_ORIGIN=http://localhost
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boxtrix-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
